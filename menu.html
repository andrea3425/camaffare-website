<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Menu — Cama'ffare</title>
  <meta name="description" content="Il menu di Cama'ffare: pizze, arancini, calzoni e fritti, gastronomia, cannoli e dolci siciliani, opzioni vegane. Padova, Via Ludovico Ariosto 38.">
  <meta name="theme-color" content="#f6f6f8">

  <link rel="icon" href="public/logo/logo_red_squared_180.png">
  <link rel="apple-touch-icon" href="public/logo/logo_red_squared_180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-app">

<!-- Tutto l'header (logo, bottoni, ricerca, categorie) resta fisso in alto.
     Deve stare QUI, figlio diretto di <body>: un elemento sticky resta
     attaccato solo finche' il suo genitore e' a schermo. -->
<header class="appbar appbar--sticky" id="appbar-sticky">
  <div class="appbar__row wrap">
    <a class="appbar__back" href="index.html" aria-label="Torna alla home">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H6M11 18l-6-6 6-6"/></svg>
    </a>
    <a class="appbar__brand" href="index.html" aria-label="Cama'ffare — home">
      <img class="appbar__logo" src="public/logo/logo_red_180.png" alt="Cama'ffare" width="180" height="64">
    </a>
    <a class="appbar__action" href="ordina.html">Ordina</a>
  </div>

  <div class="wrap">
    <div class="search">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" id="menu-search" placeholder="Cerca un piatto…" aria-label="Cerca nel menu" autocomplete="off">
      <button type="button" class="search__clear" id="search-clear" aria-label="Cancella ricerca" hidden>
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </div>

  <nav class="chips" id="chips" aria-label="Categorie del menu">
    <!-- generato da js/app.js a partire da js/menu-data.js -->
  </nav>
</header>

<h1 class="sr-only">Il menu di Cama'ffare</h1>

<main class="menu-main wrap" id="menu-root">
  <!-- generato da js/app.js a partire da js/menu-data.js -->
</main>

<p class="menu-note wrap">
  Prezzi e disponibilità possono variare. Allergeni disponibili in negozio.
</p>

<dialog class="modal" id="cat-modal" aria-labelledby="cat-modal-title">
  <div class="modal__box">
    <div class="modal__head">
      <h2 class="modal__title" id="cat-modal-title">Categorie</h2>
      <button class="modal__close" type="button" data-close aria-label="Chiudi">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <p class="modal__sub">Tocca una categoria per saltarci.</p>
    <div class="catlist"><!-- generato da js/app.js --></div>
  </div>
</dialog>

<dialog class="lightbox" id="foto-modal" aria-labelledby="foto-modal-title">
  <figure class="lightbox__fig">
    <button class="lightbox__close" type="button" data-close aria-label="Chiudi">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <img class="lightbox__img" alt="">
    <figcaption class="lightbox__cap">
      <div class="lightbox__head">
        <h2 class="lightbox__title" id="foto-modal-title"></h2>
        <p class="lightbox__price"></p>
      </div>
      <p class="lightbox__desc"></p>
    </figcaption>
  </figure>
</dialog>

<script src="js/menu-data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
